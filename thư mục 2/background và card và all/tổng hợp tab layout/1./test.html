<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card + Tab Nav</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:40px 20px;background:#0b0b12;color:#eaeaf4;
    font-family:system-ui,sans-serif;
  }

  /* ===== CARD ===== */
  .card{
    width:100%;max-width:600px;padding:24px;border-radius:20px;
    background:linear-gradient(165deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(20px) saturate(150%);
    -webkit-backdrop-filter:blur(20px) saturate(150%);
    box-shadow:0 20px 50px rgba(0,0,0,.5);
  }

  /* ===== TAB WRAP ===== */
  .tab-wrap{
    padding:5px;border-radius:100px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);
    box-shadow:inset 0 1px 2px rgba(0,0,0,.4);
  }

  /* ===== TAB LIST ===== */
  .tab-list{
    position:relative;display:flex;gap:4px;
    overflow-x:auto;overflow-y:hidden;
    scroll-behavior:smooth;
    scrollbar-width:none;-ms-overflow-style:none;
    border-radius:100px;
  }
  .tab-list::-webkit-scrollbar{display:none;width:0;height:0}

  /* ===== INDICATOR ===== */
  .indicator{
    position:absolute;top:0;left:0;height:100%;width:0;
    border-radius:100px;
    background:linear-gradient(135deg,#7c5cff,#5b8cff);
    box-shadow:0 8px 20px -8px rgba(124,92,255,.9);
    transition:transform .4s ease, width .4s ease;
    pointer-events:none;
  }

  /* ===== BUTTON ===== */
  .tab-btn{
    position:relative;z-index:1;flex:0 0 auto;min-width:80px;
    padding:10px 16px;font:inherit;font-weight:600;font-size:14px;
    color:#8b8ba3;background:none;border:0;border-radius:100px;
    cursor:pointer;white-space:nowrap;
    -webkit-tap-highlight-color:transparent;
    transition:color .3s ease;
  }
  .tab-btn.is-active{color:#fff}

  /* ===== PANEL ===== */
  .tab-panel{display:none;margin-top:18px}
  .tab-panel.is-active{display:block}
</style>
</head>
<body>

<div class="card">
  <div class="tab-wrap">
    <div class="tab-list" role="tablist" id="tabList">
      <span class="indicator" id="indicator" aria-hidden="true"></span>
      <button class="tab-btn is-active" role="tab">Tab 1</button>
      <button class="tab-btn" role="tab">Tab 2</button>
      <button class="tab-btn" role="tab">Tab 3</button>
      <button class="tab-btn" role="tab">Tab 4</button>
      <button class="tab-btn" role="tab">Tab 5</button>
      <button class="tab-btn" role="tab">Tab 6</button>
    </div>
  </div>

  <div class="tab-panel is-active">Nội dung 1</div>
  <div class="tab-panel">Nội dung 2</div>
  <div class="tab-panel">Nội dung 3</div>
  <div class="tab-panel">Nội dung 4</div>
  <div class="tab-panel">Nội dung 5</div>
  <div class="tab-panel">Nội dung 6</div>
</div>

<script>
(function(){
  const list = document.getElementById('tabList');
  const indicator = document.getElementById('indicator');
  const buttons = Array.from(list.querySelectorAll('.tab-btn'));
  const panels = Array.from(document.querySelectorAll('.tab-panel'));

  function moveIndicator(btn){
    const lr = list.getBoundingClientRect();
    const br = btn.getBoundingClientRect();
    indicator.style.width = br.width + 'px';
    indicator.style.transform = 'translateX(' + (br.left - lr.left + list.scrollLeft) + 'px)';
  }

  function centerTab(btn){
    const lr = list.getBoundingClientRect();
    const br = btn.getBoundingClientRect();
    const center = br.left - lr.left + list.scrollLeft + br.width/2;
    const target = center - list.clientWidth/2;
    const max = list.scrollWidth - list.clientWidth;
    list.scrollTo({ left: Math.max(0, Math.min(max, target)), behavior:'smooth' });
  }

  function activate(btn){
    const i = buttons.indexOf(btn);
    buttons.forEach((b,j)=>{
      b.classList.toggle('is-active', i===j);
      b.tabIndex = i===j ? 0 : -1;
    });
    panels.forEach((p,j)=>p.classList.toggle('is-active', i===j));
    moveIndicator(btn);
    centerTab(btn);
  }

  buttons.forEach(b => b.addEventListener('click', () => activate(b)));

  list.addEventListener('keydown', e => {
    const i = buttons.indexOf(document.activeElement);
    if (i < 0) return;
    let t = null;
    if (e.key === 'ArrowRight') t = buttons[(i+1) % buttons.length];
    if (e.key === 'ArrowLeft')  t = buttons[(i-1+buttons.length) % buttons.length];
    if (t){ e.preventDefault(); activate(t); t.focus(); }
  });

  window.addEventListener('resize', () => {
    const active = list.querySelector('.tab-btn.is-active');
    if (active) moveIndicator(active);
  });

  requestAnimationFrame(() => {
    const active = list.querySelector('.tab-btn.is-active');
    if (active) moveIndicator(active);
  });
})();
</script>
</body>
</html>
