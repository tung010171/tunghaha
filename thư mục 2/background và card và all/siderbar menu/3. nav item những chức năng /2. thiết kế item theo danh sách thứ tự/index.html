<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidebar - 10 Chức Năng</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --sa-panel: #070E13;
      --sa-edge: #1A242C;
      --sa-ink: #FFFFFF;
      --sa-headline: #64748B;
      --sa-row: #1E293B;
      --sa-row-hover: rgba(30, 41, 59, 0.5);
      --sa-mark: #38BDF8;
      --radius-sm: 8px;
      --font-main: 'Onest', system-ui, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent; /* Xóa vệt sáng tap highlight */
    }

    body {
      background: #020617;
      color: var(--sa-ink);
      font-family: var(--font-main);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    /* Khung chứa demo */
    .demo-frame {
      width: 280px;
      background: var(--sa-panel);
      border: 1px solid var(--sa-edge);
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 24px; /* Khoảng cách giữa các nhóm */
      box-shadow: 0 20px 40px -20px rgba(0, 0, 0, 0.9);
    }

    /* ---- NAV GROUP (Nhóm chức năng) ---- */
    .sa-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .sa-group-head {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--sa-headline);
      font-weight: 600;
      padding: 0 12px;
      margin-bottom: 4px;
    }

    /* ---- NAV ITEM (Từng nút bấm) ---- */
    .sa-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      color: var(--sa-headline);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.2s, background 0.2s;
      outline: none;
    }

    /* Hiệu ứng khi rê chuột / chạm */
    .sa-link:hover {
      color: var(--sa-ink);
      background: var(--sa-row-hover);
    }

    /* Hiệu ứng khi được chọn (Active) */
    .sa-link[aria-current="page"] {
      color: var(--sa-ink);
      background: var(--sa-row);
    }

    /* Icon */
    .sa-link-icon {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .sa-link-icon svg {
      width: 100%;
      height: 100%;
    }

    /* Chữ */
    .sa-link-text {
      flex: 1;
    }
  </style>
</head>
<body>

  <div class="demo-frame">
    
    <!-- NHÓM 1: TỔNG QUAN -->
    <div class="sa-group">
      <div class="sa-group-head">Tổng quan</div>

      <!-- 1. Dashboard -->
      <a href="#" class="sa-link" aria-current="page">
        <div class="sa-link-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect>
          </svg>
        </div>
        <span class="sa-link-text">Dashboard</span>
      </a>

      <!-- 2. Analytics -->
      <a href="#" class="sa-link">
        <div class="sa-link-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M18 20V10M12 20V4M6 20v-6"></path>
          </svg>
        </div>
        <span class="sa-link-text">Phân tích</span>
      </a>

      <!-- 3. Báo cáo -->
      <a href="#" class="sa-link">
        <div class="sa-link-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line>
          </svg>
        </div>
        <span class="sa-link-text">Báo cáo</span>
      </a>
    </div>

    <!-- NHÓM 2: QUẢN LÝ -->
    <div class="sa-group">
      <div class="sa-group-head">Quản lý</div>

      <!-- 4. Người dùng -->
      <a href="#" class="sa-link">
        <div class="sa-link-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
        </div>
        <span class="sa-link-text">Người dùng</span>
      </a>

      <!-- 5. Sản phẩm -->
      <a href="#" class="sa-link">
        <div class="sa-link-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line>
          </svg>
        </div>
        <span class="sa-link-text">Sản phẩm</span>
      </a>

      <!-- 6. Đơn hàng -->
      <a href="#" class="sa-link">
        <div class="sa-link-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
        </div>
        <span class="sa-link-text">Đơn hàng</span>
      </a>

      <!-- 7. Tin nhắn -->
      <a href="#" class="sa-link">
        <div class="sa-link-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
        </div>
        <span class="sa-link-text">Tin nhắn</span>
      </a>
    </div>

    <!-- NHÓM 3: HỆ THỐNG -->
    <div class="sa-group">
      <div class="sa-group-head">Hệ thống</div>

      <!-- 8. Cài đặt -->
      <a href="#" class="sa-link">
        <div class="sa-link-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </div>
        <span class="sa-link-text">Cài đặt</span>
      </a>

      <!-- 9. Thông báo -->
      <a href="#" class="sa-link">
        <div class="sa-link-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
        </div>
        <span class="sa-link-text">Thông báo</span>
      </a>

      <!-- 10. Trợ giúp -->
      <a href="#" class="sa-link">
        <div class="sa-link-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
        </div>
        <span class="sa-link-text">Trợ giúp</span>
      </a>
    </div>

  </div>

</body>
</html>
