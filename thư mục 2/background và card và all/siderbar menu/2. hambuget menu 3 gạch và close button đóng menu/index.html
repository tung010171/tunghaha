<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hamburger + Sidebar + Close · Dark Tech 2D</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #08090b;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #e6ebf2;
      min-height: 100vh;
      overflow-x: hidden;
      background-image:
        radial-gradient(circle at 15% 15%, rgba(0, 230, 176, 0.04) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(90, 140, 255, 0.03) 0%, transparent 50%);
    }

    /* ================= (1) HAMBURGER MENU — góc trên trái ================= */
    .hamburger {
      position: fixed;
      top: 1.5rem;
      left: 1.5rem;
      width: 52px;
      height: 52px;
      border-radius: 12px;
      background: #0f1217;
      border: 1px solid #242b36;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background 0.22s, border-color 0.22s, box-shadow 0.22s, opacity 0.25s, transform 0.25s;
      user-select: none;
      z-index: 110;
    }

    .hamburger:hover {
      background: #14181f;
      border-color: #2e3742;
      box-shadow: 0 0 22px -4px rgba(0, 230, 176, 0.5);
    }

    .hamburger:focus-visible {
      outline: 2px solid #00e6b0;
      outline-offset: 3px;
    }

    .hamburger:active {
      transform: scale(0.94);
    }

    /* Ba gạch – giữ nguyên ☰, không biến thành X (X do Close Button đảm nhận) */
    .hamburger .bars {
      width: 24px;
      height: 17px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .hamburger .bars span {
      display: block;
      height: 2px;
      width: 100%;
      background: #00e6b0;
      border-radius: 2px;
      box-shadow: 0 0 8px rgba(0, 230, 176, 0.6);
    }

    /* Khi sidebar mở, hamburger ẩn đi (nhường chỗ cho Close Button) */
    .hamburger.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.8);
    }

    /* ================= (3) CLOSE BUTTON — nằm trong sidebar ================= */
    .close-btn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: #0f1217;
      border: 1px solid #242b36;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, box-shadow 0.2s, transform 0.15s;
      user-select: none;
      flex-shrink: 0;
    }

    .close-btn:hover {
      background: #1a1215;
      border-color: #4a2428;
      box-shadow: 0 0 18px -4px rgba(255, 90, 90, 0.45);
    }

    .close-btn:active {
      transform: scale(0.92);
    }

    .close-btn:focus-visible {
      outline: 2px solid #ff5a5a;
      outline-offset: 2px;
    }

    .close-btn .x {
      position: relative;
      width: 18px;
      height: 18px;
    }

    .close-btn .x span {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 2px;
      background: #ff5a5a;
      border-radius: 2px;
      box-shadow: 0 0 8px rgba(255, 90, 90, 0.6);
      transition: background 0.2s, box-shadow 0.2s;
    }

    .close-btn .x span:nth-child(1) {
      transform: translate(-50%, -50%) rotate(45deg);
    }
    .close-btn .x span:nth-child(2) {
      transform: translate(-50%, -50%) rotate(-45deg);
    }

    .close-btn:hover .x span {
      background: #ff8080;
      box-shadow: 0 0 12px rgba(255, 90, 90, 0.9);
    }

    /* ================= (2) SIDEBAR MENU ================= */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 270px;
      background: #0d0f13;
      border-right: 1px solid #1d2128;
      display: flex;
      flex-direction: column;
      padding: 1.25rem 1rem 1.5rem;
      gap: 1.5rem;
      background-image:
        linear-gradient(180deg, #101318 0%, #0a0c10 100%),
        repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(255, 255, 255, 0.012) 40px);
      box-shadow: 8px 0 40px -18px rgba(0, 0, 0, 0.95);
      transform: translateX(-100%);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 100;
      overflow-y: auto;
    }

    .sidebar.open {
      transform: translateX(0);
    }

    /* Header sidebar: logo + close button */
    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0 0.25rem;
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: -0.4px;
      color: #f0f5fc;
      user-select: none;
    }

    .logo-icon {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: #0a1c1f;
      border: 1.5px solid #00e6b0;
      color: #00e6b0;
      font-size: 1.15rem;
      font-weight: 700;
      box-shadow: 0 0 10px rgba(0, 230, 176, 0.45);
      flex-shrink: 0;
    }

    /* Nav */
    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      flex: 1;
      list-style: none;
    }

    .nav-item {
      position: relative;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.7rem 0.9rem;
      border-radius: 0.65rem;
      color: #8b96a5;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.18s, color 0.18s, border-color 0.18s, box-shadow 0.18s;
      user-select: none;
    }

    .nav-item:hover {
      background: #14181f;
      color: #e2e9f2;
      border-color: #232a35;
    }

    .nav-item.active {
      background: #0f1c1e;
      color: #00e6b0;
      border-color: #0f3d38;
      box-shadow: inset 0 0 0 1px rgba(0, 230, 176, 0.25), 0 0 14px -6px rgba(0, 230, 176, 0.4);
    }

    .nav-item.active::before {
      content: '';
      position: absolute;
      left: -1rem;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 60%;
      background: #00e6b0;
      border-radius: 0 3px 3px 0;
      box-shadow: 0 0 10px #00e6b0;
    }

    .nav-icon {
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      font-size: 1rem;
      flex-shrink: 0;
      opacity: 0.8;
    }

    .nav-item.active .nav-icon {
      opacity: 1;
      filter: drop-shadow(0 0 6px #00e6b0);
    }

    .nav-label {
      margin-left: auto;
      font-size: 0.65rem;
      font-weight: 600;
      padding: 0.15rem 0.45rem;
      border-radius: 2rem;
      background: #1a1f27;
      color: #6f7c8c;
      border: 1px solid #242b36;
      letter-spacing: 0.3px;
    }

    .nav-item.active .nav-label {
      background: #0e2a25;
      color: #00e6b0;
      border-color: #0f4a42;
    }

    .sidebar-footer {
      padding-top: 1.1rem;
      border-top: 1px solid #1a1e25;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.68rem;
      color: #4b5563;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      user-select: none;
    }

    .status-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #00e6b0;
      box-shadow: 0 0 8px #00e6b0;
      margin-right: 0.4rem;
    }

    /* ================= OVERLAY (nền tối khi mở) ================= */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 6, 8, 0.65);
      backdrop-filter: blur(2px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      z-index: 90;
    }

    .overlay.open {
      opacity: 1;
      visibility: visible;
    }

    /* ================= MAIN CONTENT (placeholder) ================= */
    .main {
      padding: 7rem 2rem 2rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: padding-left 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .main h1 {
      font-size: 1.15rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #5c6775;
      margin-bottom: 0.75rem;
      font-weight: 600;
    }

    .main p {
      font-size: 0.78rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      max-width: 460px;
      line-height: 1.8;
      color: #2e3540;
    }

    .main .hint {
      margin-top: 1.75rem;
      font-size: 0.7rem;
      color: #00e6b0;
      letter-spacing: 1.5px;
      opacity: 0.75;
    }
  </style>
</head>
<body>

  <!-- (1) HAMBURGER MENU — góc trên trái -->
  <button class="hamburger" id="hamburger" aria-label="Mở sidebar" aria-expanded="false" aria-controls="sidebar">
    <span class="bars">
      <span></span>
      <span></span>
      <span></span>
    </span>
  </button>

  <!-- (2) SIDEBAR MENU -->
  <aside class="sidebar" id="sidebar" aria-hidden="true">
    <!-- Header: logo + (3) Close Button -->
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="logo-icon">◈</div>
        <span>NEXUS</span>
      </div>

      <!-- (3) CLOSE BUTTON — nút ✕ đóng sidebar -->
      <button class="close-btn" id="closeBtn" aria-label="Đóng sidebar">
        <span class="x">
          <span></span>
          <span></span>
        </span>
      </button>
    </div>

    <!-- Nav -->
    <ul class="sidebar-nav">
      <li class="nav-item active">
        <span class="nav-icon">▣</span>
        <span>Dashboard</span>
        <span class="nav-label">LIVE</span>
      </li>
      <li class="nav-item">
        <span class="nav-icon">◧</span>
        <span>Analytics</span>
      </li>
      <li class="nav-item">
        <span class="nav-icon">◨</span>
        <span>Projects</span>
        <span class="nav-label">3</span>
      </li>
      <li class="nav-item">
        <span class="nav-icon">◩</span>
        <span>Messages</span>
      </li>
      <li class="nav-item">
        <span class="nav-icon">◪</span>
        <span>Settings</span>
      </li>
    </ul>

    <div class="sidebar-footer">
      <span><span class="status-dot"></span>online</span>
      <span>v2.4.0</span>
    </div>
  </aside>

  <!-- Overlay -->
  <div class="overlay" id="overlay"></div>

  <!-- Main placeholder -->
  <main class="main">
    <h1>Main Content</h1>
    <p>Click ☰ ở góc trên trái để mở sidebar, sau đó bấm ✕ để đóng.</p>
    <span class="hint">☰ → mở &nbsp;|&nbsp; ✕ → đóng</span>
  </main>

  <script>
    (function () {
      const hamburger = document.getElementById('hamburger');
      const sidebar = document.getElementById('sidebar');
      const closeBtn = document.getElementById('closeBtn');
      const overlay = document.getElementById('overlay');

      function openSidebar() {
        sidebar.classList.add('open');
        sidebar.setAttribute('aria-hidden', 'false');
        overlay.classList.add('open');
        hamburger.classList.add('hidden');
        hamburger.setAttribute('aria-expanded', 'true');
      }

      function closeSidebar() {
        sidebar.classList.remove('open');
        sidebar.setAttribute('aria-hidden', 'true');
        overlay.classList.remove('open');
        hamburger.classList.remove('hidden');
        hamburger.setAttribute('aria-expanded', 'false');
      }

      // (1) Hamburger → mở sidebar
      hamburger.addEventListener('click', openSidebar);

      // (3) Close Button → đóng sidebar
      closeBtn.addEventListener('click', closeSidebar);

      // Click overlay cũng đóng (tiện dụng)
      overlay.addEventListener('click', closeSidebar);

      // Phím ESC để đóng
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && sidebar.classList.contains('open')) {
          closeSidebar();
        }
      });
    })();
  </script>

</body>
</html>
