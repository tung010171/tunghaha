<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overlay Intro · Dark Neon Glitch</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; overflow: hidden;
    background: #0a0a0f; color: #fff;
    font-family: system-ui, -apple-system, sans-serif;
  }

  /* ===== TRANG BÊN DƯỚI — DARK MODE ===== */
  .page {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #0a0a0f;
    color: rgba(255,255,255,.85);
  }
  .page h2 { font-size: clamp(1.8rem, 4vw, 3rem); }

  /* ===== OVERLAY — DARK THUẦN ===== */
  .overlay {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    background: #0a0a0f;
    opacity: 1;
    transition: opacity .5s ease;
    will-change: opacity;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }

  /* Glitch burst: nháy nhanh 3 frame trước khi tắt */
  .overlay.burst {
    animation: glitchBurst .45s steps(3) 1;
  }
  @keyframes glitchBurst {
    0%   { opacity: 1; }
    33%  { opacity: .25; }
    66%  { opacity: .9; }
    100% { opacity: 1; }
  }

  /* ===== STAGE — NGANG & GIỮA ===== */
  .stage {
    display: flex; align-items: center; justify-content: center;
    gap: clamp(2rem, 5vw, 4rem);
    padding: 2rem;
  }

  /* ===== CHỮ GLITCH ===== */
  .greeting {
    position: relative;
    display: inline-block;
    font-size: clamp(2.8rem, 7vw, 5.4rem);
    font-weight: 800;
    letter-spacing: -.03em;
    line-height: 1;
    color: #fff;
    white-space: nowrap;
    text-shadow: 0 0 24px rgba(255,255,255,.15);
    animation: fadeIn .8s .3s ease both;
  }

  /* 2 lớp glitch cyan + magenta */
  .greeting::before,
  .greeting::after {
    content: attr(data-text);
    position: absolute;
    inset: 0;
    pointer-events: none;
    will-change: transform, clip-path;
  }
  .greeting::before {
    color: #00f0ff;
    text-shadow: 0 0 12px #00f0ff;
    animation: glitchCyan 2.4s steps(2) infinite;
  }
  .greeting::after {
    color: #ff2d95;
    text-shadow: 0 0 12px #ff2d95;
    animation: glitchMagenta 2.4s steps(2) infinite;
  }

  @keyframes glitchCyan {
    0%   { clip-path: inset(10% 0 78% 0); transform: translate(-3px, -2px); }
    15%  { clip-path: inset(60% 0 20% 0); transform: translate(3px, 1px); }
    30%  { clip-path: inset(20% 0 55% 0); transform: translate(-2px, 2px); }
    45%  { clip-path: inset(75% 0 5% 0);  transform: translate(2px, -1px); }
    60%  { clip-path: inset(35% 0 40% 0); transform: translate(-3px, 1px); }
    75%  { clip-path: inset(5% 0 85% 0);  transform: translate(3px, -2px); }
    100% { clip-path: inset(10% 0 78% 0); transform: translate(-3px, -2px); }
  }
  @keyframes glitchMagenta {
    0%   { clip-path: inset(70% 0 10% 0); transform: translate(3px, 2px); }
    15%  { clip-path: inset(15% 0 70% 0); transform: translate(-3px, -1px); }
    30%  { clip-path: inset(55% 0 25% 0); transform: translate(2px, -2px); }
    45%  { clip-path: inset(10% 0 75% 0); transform: translate(-2px, 1px); }
    60%  { clip-path: inset(45% 0 35% 0); transform: translate(3px, -1px); }
    75%  { clip-path: inset(80% 0 3% 0);  transform: translate(-3px, 2px); }
    100% { clip-path: inset(70% 0 10% 0); transform: translate(3px, 2px); }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ===== NÚT BẮT ĐẦU — NEON OUTLINE ===== */
  .start-btn {
    position: relative;
    display: inline-flex; align-items: center; gap: .8rem;
    padding: 1rem 2.6rem;
    font-size: .82rem; font-weight: 600;
    letter-spacing: .32em; text-transform: uppercase;
    color: #fff;
    background: transparent;
    border: 1px solid rgba(255,255,255,.35);
    border-radius: 2px;
    cursor: pointer;
    overflow: hidden;
    transform: translateZ(0);
    transition: color .35s ease, border-color .35s ease, transform .35s ease;
    will-change: transform;
    -webkit-tap-highlight-color: transparent;
    appearance: none; -webkit-appearance: none;
    outline: none; user-select: none;
    opacity: 0;
    animation: fadeUp .8s .55s ease forwards;
  }
  /* Viền neon chạy quanh nút khi hover */
  .start-btn::before {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(120deg,
      transparent 30%,
      rgba(0, 240, 255, .9) 48%,
      rgba(255, 45, 149, .9) 52%,
      transparent 70%);
    background-size: 250% 100%;
    background-position: 200% 0;
    opacity: 0;
    transition: opacity .35s ease;
    pointer-events: none;
    z-index: -1;
    animation: borderRun 2.5s linear infinite paused;
  }
  .start-btn:hover::before {
    opacity: 1;
    animation-play-state: running;
  }
  @keyframes borderRun {
    to { background-position: -200% 0; }
  }
  .start-btn:hover {
    border-color: transparent;
    transform: translateZ(0) translateY(-2px);
  }
  .start-btn:active { transform: translateZ(0) translateY(0); }
  .start-btn:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px rgba(0, 240, 255, .25);
  }
  .start-btn .arrow {
    display: inline-block;
    transition: transform .35s ease;
    will-change: transform;
  }
  .start-btn:hover .arrow { transform: translateX(5px); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ===== REDUCED MOTION ===== */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
    .greeting, .start-btn { opacity: 1; }
    .greeting::before, .greeting::after { display: none; }
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 760px) {
    .stage { flex-direction: column; gap: 1.8rem; }
    .greeting { white-space: normal; }
    .start-btn { padding: .85rem 1.9rem; font-size: .72rem; letter-spacing: .22em; }
  }
</style>
</head>
<body>

<div class="page"><h2>Chào mừng bạn</h2></div>

<div class="overlay" id="overlay">
  <div class="stage">
    <h1 class="greeting" data-text="Xin chào.">Xin chào.</h1>
    <button class="start-btn" id="startBtn">
      Bắt đầu <span class="arrow">→</span>
    </button>
  </div>
</div>

<script>
  const overlay = document.getElementById('overlay');
  const btn     = document.getElementById('startBtn');
  let done = false;

  btn.addEventListener('click', () => {
    if (done) return;
    done = true;
    btn.disabled = true;
    overlay.classList.add('burst');         // nháy glitch 3 frame
    setTimeout(() => {
      overlay.classList.add('hidden');      // rồi tắt mờ
    }, 450);
    setTimeout(() => overlay.remove(), 1100);
  });

  btn.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      btn.click();
    }
  });
</script>

</body>
</html>
