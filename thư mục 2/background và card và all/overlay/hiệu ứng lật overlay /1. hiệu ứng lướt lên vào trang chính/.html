<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curtain Reveal</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden;
    font-family: system-ui, -apple-system, sans-serif; }

  /* ===== NỘI DUNG BÊN DƯỚI (bị che lúc đầu) ===== */
  .page {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #1a1a2e, #0f0f1a);
    color: #fff; text-align: center; padding: 2rem;
  }
  .page h2 {
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 700;
    background: linear-gradient(to right, #fff, #b0aaff);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  .page p { margin-top: 1rem; color: #9a9ac0; font-weight: 300; }

  /* ===== OVERLAY (rèm) ===== */
  .overlay {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    background: #0e0e12;
    color: #fff;
    /* Trượt lên bằng translateY */
    transform: translateY(0);
    transition: transform 1s cubic-bezier(.77, 0, .18, 1);
    will-change: transform;
    transform: translateZ(0);
  }
  .overlay.hidden {
    transform: translateY(-100%);
    pointer-events: none;
  }

  /* Nội dung overlay */
  .content {
    text-align: center;
    padding: 2rem;
  }
  .greeting {
    font-size: clamp(2.6rem, 6vw, 4.8rem);
    font-weight: 700; letter-spacing: -.03em;
    color: #fff;
    opacity: 0;
    animation: fadeUp .9s .3s ease forwards;
  }
  .start-btn {
    margin-top: 2.4rem;
    padding: 1.1rem 2.8rem;
    font-size: .85rem; font-weight: 600;
    letter-spacing: .28em; text-transform: uppercase;
    color: #0e0e12; background: #fff;
    border: 1px solid #fff; border-radius: 100px;
    cursor: pointer;
    transform: translateZ(0);
    transition: transform .4s ease, background .4s ease, color .4s ease;
    -webkit-tap-highlight-color: transparent;
    appearance: none; -webkit-appearance: none;
    outline: none; user-select: none;
    opacity: 0;
    animation: fadeUp .9s .5s ease forwards;
  }
  .start-btn:hover {
    background: transparent; color: #fff;
    transform: translateZ(0) translateY(-3px);
  }
  .start-btn:active {
    transform: translateZ(0) translateY(-1px) scale(.98);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Tôn trọng giảm chuyển động */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>
<body>

<!-- Nội dung bên dưới -->
<div class="page">
  <div>
    <h2>Chào mừng bạn</h2>
    <p>Overlay đã trượt lên như rèm để lộ nội dung này.</p>
  </div>
</div>

<!-- Overlay (rèm) -->
<div class="overlay" id="overlay">
  <div class="content">
    <h1 class="greeting">Xin chào.</h1>
    <button class="start-btn" id="startBtn">Bắt đầu</button>
  </div>
</div>

<script>
  const overlay = document.getElementById('overlay');
  const btn     = document.getElementById('startBtn');
  let done = false;

  btn.addEventListener('click', () => {
    if (done) return;
    done = true;
    btn.disabled = true;
    overlay.classList.add('hidden');       // trượt lên
    setTimeout(() => overlay.remove(), 1400);
  });
</script>

</body>
</html>
