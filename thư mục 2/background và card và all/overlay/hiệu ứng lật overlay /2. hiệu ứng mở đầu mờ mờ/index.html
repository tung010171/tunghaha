<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staggered Animation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden;
    font-family: system-ui, -apple-system, sans-serif; }

  /* ===== NỀN ===== */
  .stage {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 1.2rem;
    background: radial-gradient(ellipse at 50% 40%, #171731, #06060c 70%);
    color: #fff;
    padding: 2rem;
  }

  /* ===== PHẦN TỬ CHUNG ===== */
  .item {
    opacity: 0;
    transform: translateY(24px);
    will-change: transform, opacity;
    animation: fadeUp .8s cubic-bezier(.16, 1, .3, 1) forwards;
  }

  /* ===== NỘI DUNG ===== */
  .label {
    font-size: .75rem;
    letter-spacing: .38em;
    text-transform: uppercase;
    color: rgba(255,255,255,.45);
  }
  .title {
    font-size: clamp(2.5rem, 6vw, 4.5rem);
    font-weight: 700;
    letter-spacing: -.03em;
    background: linear-gradient(135deg, #fff, #d4caff, #90b0ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle {
    font-size: 1rem;
    color: rgba(200, 200, 255, .7);
    max-width: 480px;
    text-align: center;
    font-weight: 300;
  }

  /* ===== NÚT ===== */
  .btn {
    margin-top: 1rem;
    padding: 1rem 2.6rem;
    font-size: .85rem; font-weight: 600;
    letter-spacing: .28em; text-transform: uppercase;
    color: #0e0e12; background: #fff;
    border: 1px solid #fff; border-radius: 100px;
    cursor: pointer;
    transition: transform .3s ease, background .3s ease, color .3s ease;
    will-change: transform;
    -webkit-tap-highlight-color: transparent;
    appearance: none; -webkit-appearance: none;
    outline: none;
  }
  .btn:hover {
    background: transparent; color: #fff;
    transform: translateY(-3px);
  }

  /* ===== STAGGER — delay so le ===== */
  .item:nth-child(1) { animation-delay: .1s; }
  .item:nth-child(2) { animation-delay: .3s; }
  .item:nth-child(3) { animation-delay: .5s; }
  .item:nth-child(4) { animation-delay: .7s; }
  .item:nth-child(5) { animation-delay: .9s; }

  /* ===== KEYFRAME ===== */
  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== REDUCED MOTION ===== */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
    .item { opacity: 1; transform: none; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="item label">Chào mừng</div>
  <div class="item title">Xin chào.</div>
  <div class="item subtitle">
    Đây là demo hiệu ứng <strong>staggered animation</strong> —
    các phần tử xuất hiện lần lượt nhờ <code>animation-delay</code> khác nhau.
  </div>
  <button class="item btn">Bắt đầu</button>
  <div class="item label" style="opacity:.3;">v1.0 · intro</div>
</div>

</body>
</html>
