<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Login - 1 Input</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Nền tối để làm nổi bật hiệu ứng kính mờ */
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            overflow: hidden;
        }

        /* --- HIỆU ỨNG KÍNH MỜ (GLASSMORPHISM) --- */
        .glass-card {
            position: relative;
            z-index: 10;
            width: 350px;
            padding: 40px 30px;
            
            /* 1. Nền bán trong suốt */
            background: rgba(255, 255, 255, 0.05);
            /* 2. Làm mờ hậu cảnh */
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            /* 3. Viền sáng mờ */
            border: 1px solid rgba(255, 255, 255, 0.15);
            /* 4. Bo góc */
            border-radius: 20px;
            /* 5. Đổ bóng */
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.1);

            /* --- HIỆU ỨNG SLIDE UP FADE IN --- */
            opacity: 0;
            transform: translateY(30px);
            animation: slideUpFade 0.8s ease-out forwards;
        }

        @keyframes slideUpFade {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* --- NỘI DUNG FORM --- */
        .card-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .card-header h2 {
            color: #ffffff;
            font-size: 22px;
            font-weight: 600;
        }

        .card-header p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            margin-top: 5px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-group {
            position: relative;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 15px 14px 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
            font-weight: 300;
        }

        .input-group input:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(0, 210, 255, 0.5);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #00d2ff 0%, #3a7bd5 100%);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 210, 255, 0.3);
            margin-top: 5px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 210, 255, 0.5);
        }

        .btn-login:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <div class="card-header">
            <h2>Login Form</h2>
            <p>Nhập mật khẩu để tiếp tục</p>
        </div>

        <form class="login-form" id="loginForm">
            <!-- CHỈ CÒN 1 INPUT DUY NHẤT -->
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">Login</button>
        </form>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            loginBtn.textContent = 'Đang xử lý...';
            loginBtn.disabled = true;
            loginBtn.style.opacity = '0.7';

            setTimeout(() => {
                loginBtn.textContent = 'Login';
                loginBtn.disabled = false;
                loginBtn.style.opacity = '1';
                alert('Đăng nhập thành công (giả lập)!');
                loginForm.reset();
            }, 1500);
        });
    </script>
</body>
</html>
