<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lamp Login - Mobile</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --on: 0;
            --opening: hsl(270, calc((10 + var(--on) * 70) * 1%), calc((18 + var(--on) * 68) * 1%));
            --base-top: hsl(270, calc(var(--on) * 25%), calc((30 + var(--on) * 38) * 1%));
            --base-side: hsl(270, calc(var(--on) * 25%), calc((15 + var(--on) * 35) * 1%));
            --post: hsl(270, calc(var(--on) * 20%), calc((18 + var(--on) * 35) * 1%));
            --shade-l: hsl(270, calc(var(--on) * 35%), calc((28 + var(--on) * 55) * 1%));
            --shade-m: hsl(270, calc(var(--on) * 35%), calc((16 + var(--on) * 32) * 1%));
            --shade-d: hsl(270, calc(var(--on) * 35%), calc((9 + var(--on) * 18) * 1%));
            --blend-a: hsla(270, calc(var(--on) * 30%), calc((45 + var(--on) * 50) * 1%), 0.85);
            --blend-b: hsla(270, calc(var(--on) * 30%), calc((18 + var(--on) * 28) * 1%), 0.25);
            --blend-c: hsla(270, calc(var(--on) * 30%), calc((18 + var(--on) * 28) * 1%), 0.50);
            --glow-a: hsla(270, calc(var(--on) * 40%), calc((40 + var(--on) * 55) * 1%), 0.85);
            --cord-l: calc((38 + var(--on) * 52) * 1%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            overflow: hidden;
            padding: 20px;
        }

        /* Ánh sáng môi trường */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse 70% 50% at 50% 40%,
                    rgba(100, 20, 180, .25) 0%,
                    rgba(40, 5, 80, .1) 52%,
                    transparent 75%);
            opacity: var(--on);
            transition: opacity .9s ease;
            pointer-events: none;
            z-index: 0;
        }

        /* ─── BỐ CỤC DỌC (MOBILE) ─── */
        .scene {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 100vh;
        }

        /* ─── DÒNG CHỮ HƯỚNG DẪN ─── */
        .instruction {
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1px;
            text-align: center;
            animation: pulse 2s infinite;
            transition: opacity 0.5s ease;
            margin-bottom: -10px;
            z-index: 20;
        }

        .instruction.hidden {
            opacity: 0;
            pointer-events: none;
        }

        @keyframes pulse {
            0% { opacity: 0.6; text-shadow: 0 0 5px rgba(255,255,255,0.2); }
            50% { opacity: 1; text-shadow: 0 0 15px rgba(255,255,255,0.8); }
            100% { opacity: 0.6; text-shadow: 0 0 5px rgba(255,255,255,0.2); }
        }

        /* ─── BÓNG ĐÈN ─── */
        .lamp {
            height: 38vh;
            min-height: 240px;
            max-height: 320px;
            width: auto;
            overflow: visible !important;
            flex-shrink: 0;
            margin-top: -15px;
        }

        /* Dây bóng đèn to hơn (stroke-width: 12) */
        .lamp-cord {
            stroke: hsl(270, 0%, var(--cord-l));
            transition: stroke .1s;
            cursor: grab;
        }
        .lamp-cord:active {
            cursor: grabbing;
        }

        .lamp-light {
            opacity: var(--on);
        }

        .fill-opening { fill: var(--opening); }
        .fill-base-top { fill: var(--base-top); }
        .fill-base-side { fill: var(--base-side); }
        .fill-post { fill: var(--post); }
        .fill-shade { fill: var(--shade-d); }

        /* Vùng nhấn kéo dây được mở rộng */
        .lamp-hit {
            cursor: grab;
            fill: transparent;
        }
        .lamp-hit:active { cursor: grabbing; }

        /* ─── GLASSMORPHISM CARD ─── */
        .glass-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 340px;
            padding: 28px 22px;
            
            background: rgba(26, 4, 50, 0.65);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.1);

            opacity: 0;
            transform: scale(0.9) translateY(20px);
            transition: opacity 0.88s cubic-bezier(0.22, 1, 0.36, 1),
                        transform 0.88s cubic-bezier(0.22, 1, 0.36, 1),
                        border-color 0.88s ease,
                        box-shadow 0.88s ease;
            pointer-events: none;
        }

        .glass-card.is-active {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
            border-color: rgba(170, 65, 255, 0.38);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.65),
                        0 0 44px 3px rgba(118, 30, 192, 0.16),
                        0 0 80px 12px rgba(55, 7, 110, 0.1);
        }

        /* ─── NỘI DUNG FORM ─── */
        .card-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .card-header h2 {
            color: #ffffff;
            font-size: 20px;
            font-weight: 600;
        }

        .card-header p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
            margin-top: 5px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-group {
            position: relative;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 13px 15px 13px 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
            font-weight: 300;
        }

        .input-group input:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(0, 210, 255, 0.5);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
        }

        .btn-login {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #00d2ff 0%, #3a7bd5 100%);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 210, 255, 0.3);
            margin-top: 5px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 210, 255, 0.5);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }
    </style>
</head>
<body>

    <div class="scene">
        <!-- Dòng chữ hướng dẫn -->
        <div class="instruction" id="instruction">Hãy kéo dây bóng đèn</div>

        <!-- ══════════ BÓNG ĐÈN ══════════ -->
        <svg class="lamp" viewBox="0 0 333 484" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse class="fill-opening" cx="165" cy="220" rx="130" ry="20" />
            <ellipse cx="165" cy="220" rx="130" ry="20" fill="url(#grad-opening)" style="opacity:calc(1 - var(--on))" />

            <path class="fill-base-side"
                d="M165 464c44.183 0 80-8.954 80-20v-14h-22.869c-14.519-3.703-34.752-6-57.131-6-22.379 0-42.612 2.297-57.131 6H85v14c0 11.046 35.817 20 80 20z" />
            <path
                d="M165 464c44.183 0 80-8.954 80-20v-14h-22.869c-14.519-3.703-34.752-6-57.131-6-22.379 0-42.612 2.297-57.131 6H85v14c0 11.046 35.817 20 80 20z"
                fill="url(#grad-side)" />
            <ellipse class="fill-base-top" cx="165" cy="430" rx="80" ry="20" />
            <ellipse cx="165" cy="430" rx="80" ry="20" fill="url(#grad-base)" />

            <path class="fill-post" d="M180 142h-30v286c0 3.866 6.716 7 15 7 8.284 0 15-3.134 15-7V142z" />
            <path d="M180 142h-30v286c0 3.866 6.716 7 15 7 8.284 0 15-3.134 15-7V142z" fill="url(#grad-post)" />

            <!-- Dây kéo đã được làm TO HƠN (stroke-width="12") -->
            <path id="js-cord" class="lamp-cord" d="M124 190 L124 348" stroke-width="12" stroke-linecap="round" />

            <path class="lamp-light" d="M290.5 193H39L0 463.5c0 11.046 75.478 20 165.5 20s167-11.954 167-23l-42-267.5z"
                fill="url(#grad-light)" />

            <path class="fill-shade" fill-rule="evenodd" clip-rule="evenodd"
                d="M164.859 0c55.229 0 100 8.954 100 20l29.859 199.06C291.529 208.451 234.609 200 164.859 200S38.189 208.451 35 219.06L64.859 20c0-11.046 44.772-20 100-20z" />
            <path fill-rule="evenodd" clip-rule="evenodd"
                d="M164.859 0c55.229 0 100 8.954 100 20l29.859 199.06C291.529 208.451 234.609 200 164.859 200S38.189 208.451 35 219.06L64.859 20c0-11.046 44.772-20 100-20z"
                fill="url(#grad-shade)" />

            <defs>
                <linearGradient id="grad-opening" x1="35" y1="220" x2="295" y2="220" gradientUnits="userSpaceOnUse">
                    <stop /><stop offset="1" stop-opacity="0" />
                </linearGradient>
                <linearGradient id="grad-base" x1="85" y1="444" x2="245" y2="444" gradientUnits="userSpaceOnUse">
                    <stop stop-color="var(--blend-a)" /><stop offset=".8" stop-color="var(--blend-b)" stop-opacity="0" />
                </linearGradient>
                <linearGradient id="grad-side" x1="119" y1="430" x2="245" y2="430" gradientUnits="userSpaceOnUse">
                    <stop stop-color="var(--blend-c)" /><stop offset="1" stop-color="var(--blend-b)" stop-opacity="0" />
                </linearGradient>
                <linearGradient id="grad-post" x1="150" y1="288" x2="180" y2="288" gradientUnits="userSpaceOnUse">
                    <stop stop-color="var(--blend-a)" /><stop offset="1" stop-color="var(--blend-b)" stop-opacity="0" />
                </linearGradient>
                <linearGradient id="grad-light" x1="165.5" y1="218.5" x2="165.5" y2="340" gradientUnits="userSpaceOnUse">
                    <stop stop-color="var(--glow-a)" stop-opacity=".10" />
                    <stop offset="1" stop-color="var(--glow-a)" stop-opacity="0" />
                </linearGradient>
                <linearGradient id="grad-shade" x1="56" y1="110" x2="295" y2="110" gradientUnits="userSpaceOnUse">
                    <stop stop-color="var(--shade-l)" stop-opacity=".8" />
                    <stop offset="1" stop-color="var(--shade-m)" stop-opacity="0" />
                </linearGradient>
            </defs>

            <!-- Vùng nhấn kéo dây mở rộng (r=70) để dễ chạm hơn trên mobile -->
            <circle id="js-hit" class="lamp-hit" cx="124" cy="348" r="70" />
        </svg>

        <!-- ══════════ FORM LOGIN ══════════ -->
        <div class="glass-card" id="js-card">
            <div class="card-header">
                <h2>Login Form</h2>
                <p>Nhập mật khẩu để tiếp tục</p>
            </div>

            <form class="login-form" id="loginForm">
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">Login</button>
            </form>
        </div>
    </div>

    <script>
        /* ══════════ 1. LOGIC KÉO DÂY ĐÈN ══════════ */
        const ROOT = document.documentElement;
        const card = document.getElementById('js-card');
        const cord = document.getElementById('js-cord');
        const hit = document.getElementById('js-hit');
        const lampEl = document.querySelector('.lamp');
        const instruction = document.getElementById('instruction');

        const AX = 124, AY = 190;
        const REST_X = 124, REST_Y = 348;
        const TRIGGER_DIST = 55; // Khoảng cách kéo để kích hoạt đèn

        let dragging = false;
        let animating = false;
        let lightOn = false;
        let curX = REST_X, curY = REST_Y;

        function toSVG(sx, sy) {
            const pt = lampEl.createSVGPoint();
            pt.x = sx; pt.y = sy;
            return pt.matrixTransform(lampEl.getScreenCTM().inverse());
        }

        function buildCord(tx, ty) {
            const dx = tx - AX, dy = ty - AY;
            const sag = Math.max(4, 30 - Math.hypot(dx, dy) * 0.06);
            const c1x = AX + dx * 0.15 + sag, c1y = AY + dy * 0.30 + sag;
            const c2x = AX + dx * 0.70 - sag * 0.3, c2y = AY + dy * 0.72 - sag * 0.2;
            return `M${AX},${AY} C${c1x},${c1y} ${c2x},${c2y} ${tx},${ty}`;
        }

        function updateCord(tx, ty) {
            curX = tx; curY = ty;
            cord.setAttribute('d', buildCord(tx, ty));
            const tension = Math.min(Math.hypot(tx - REST_X, ty - REST_Y) / 120, 1);
            cord.style.stroke = `hsl(270, 0%, ${Math.round(38 + tension * 52)}%)`;
        }

        function springBack(fromX, fromY, triggered) {
            if (animating) return;
            animating = true;
            const dur = triggered ? 380 : 500;
            const t0 = performance.now();

            function tick(now) {
                const t = Math.min((now - t0) / dur, 1);
                const fn = triggered ? easeElastic(t) : easeOutBounce(t);
                updateCord(fromX + (REST_X - fromX) * fn, fromY + (REST_Y - fromY) * fn);
                if (t < 1) { requestAnimationFrame(tick); return; }
                updateCord(REST_X, REST_Y);
                cord.style.stroke = '';
                animating = false;
            }
            requestAnimationFrame(tick);
        }

        function easeElastic(t) {
            if (!t || t === 1) return t;
            return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI / 3)) + 1;
        }
        function easeOutBounce(t) {
            if (t < 1 / 2.75) return 7.5625 * t * t;
            if (t < 2 / 2.75) { t -= 1.5 / 2.75; return 7.5625 * t * t + 0.750; }
            if (t < 2.5 / 2.75) { t -= 2.25 / 2.75; return 7.5625 * t * t + 0.9375; }
            t -= 2.625 / 2.75; return 7.5625 * t * t + 0.984375;
        }

        function client(e) {
            return e.touches
                ? { x: e.touches[0].clientX, y: e.touches[0].clientY }
                : { x: e.clientX, y: e.clientY };
        }

        function onDown(e) {
            if (animating) return;
            e.preventDefault();
            dragging = true;
        }
        function onMove(e) {
            if (!dragging) return;
            e.preventDefault();
            const { x, y } = client(e);
            const sv = toSVG(x, y);
            updateCord(sv.x, Math.max(AY + 20, sv.y));
        }
        function onUp() {
            if (!dragging) return;
            dragging = false;
            const dist = Math.hypot(curX - REST_X, curY - REST_Y);
            if (dist > TRIGGER_DIST) toggleLight();
            springBack(curX, curY, dist > TRIGGER_DIST);
        }

        [hit, cord].forEach(el => {
            el.addEventListener('mousedown', onDown);
            el.addEventListener('touchstart', onDown, { passive: false });
        });
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
        window.addEventListener('touchmove', onMove, { passive: false });
        window.addEventListener('touchend', onUp);

        function toggleLight() {
            lightOn = !lightOn;
            ROOT.style.setProperty('--on', lightOn ? '1' : '0');
            card.classList.toggle('is-active', lightOn);
            
            // Ẩn dòng chữ hướng dẫn khi đèn bật
            if (lightOn) {
                instruction.classList.add('hidden');
            } else {
                instruction.classList.remove('hidden');
            }
        }

        /* ══════════ 2. LOGIC FORM LOGIN ══════════ */
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const passwordInput = document.getElementById('password');

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const pass = passwordInput.value.trim();

            if (!pass) {
                loginBtn.style.animation = 'none';
                void loginBtn.offsetHeight;
                loginBtn.style.animation = 'shake .4s ease';
                return;
            }
            
            loginBtn.textContent = 'Đang xử lý...';
            loginBtn.disabled = true;
            loginBtn.style.opacity = '0.7';

            setTimeout(() => {
                loginBtn.textContent = 'Login';
                loginBtn.disabled = false;
                loginBtn.style.opacity = '1';
                alert('Đăng nhập thành công (giả lập)!');
                loginForm.reset();
            }, 1500);
        });
    </script>
</body>
</html>
