<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Nebula Flow — Canvas</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #05060d; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: crosshair; }

  .hint {
    position: fixed;
    left: 50%; bottom: 22px;
    transform: translateX(-50%);
    font: 500 11px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, .38);
    white-space: nowrap;
    pointer-events: none;
    user-select: none;
    transition: opacity 1s ease;
    text-shadow: 0 0 18px rgba(120, 200, 255, .35);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">Di chuyển chuột để khuấy động · Nhấn để bùng nổ</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const hint = document.querySelector(".hint");

  let W = 0, H = 0, DPR = 1;

  const mouse = { x: -9999, y: -9999, active: false };
  const particles = [];
  const sparks = [];
  let blobs = [];

  const rnd = (a, b) => a + Math.random() * (b - a);
  const TAU = Math.PI * 2;

  /* ---------- Trường dòng chảy (flow field) ---------- */
  function field(x, y, t) {
    return (
      Math.sin(x * 0.0032 + t * 1.7) +
      Math.cos(y * 0.0038 - t * 1.3) +
      Math.sin((x + y) * 0.0021 + t * 0.9)
    ) * 1.05; // ~ -3.15 .. 3.15 radian
  }

  /* ---------- Hạt ---------- */
  function makeParticle() {
    const p = {
      x: Math.random() * W,
      y: Math.random() * H,
      px: 0, py: 0,
      speed: rnd(0.45, 1.8),
      hue: rnd(170, 320),      // cyan → xanh → tím → hồng
      width: rnd(0.5, 1.7),
      alpha: rnd(0.22, 0.72)
    };
    p.px = p.x;
    p.py = p.y;
    return p;
  }

  /* ---------- Các đám mây màu (nebula) ---------- */
  function makeBlobs() {
    const palette = [190, 215, 265, 300, 340];
    blobs = palette.map((hue) => ({
      hue,
      angle: rnd(0, TAU),
      spin: rnd(-0.0022, 0.0022),
      rx: rnd(0.16, 0.40),
      ry: rnd(0.14, 0.36),
      phase: rnd(0, TAU),
      size: rnd(0.30, 0.58),
      speed: rnd(0.5, 1.4)
    }));
  }

  /* ---------- Kích thước ---------- */
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    ctx.fillStyle = "#05060d";
    ctx.fillRect(0, 0, W, H);

    // Số hạt phụ thuộc diện tích màn hình
    const target = Math.round(Math.min(900, Math.max(220, (W * H) / 3000)));
    while (particles.length < target) particles.push(makeParticle());
    particles.length = target;

    makeBlobs();
  }

  /* ---------- Nổ khi click ---------- */
  function burst(x, y) {
    const n = 90;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU;
      const s = rnd(1.5, 7.5);
      sparks.push({
        x, y, px: x, py: y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: 1,
        decay: rnd(0.008, 0.022),
        hue: rnd(170, 330),
        width: rnd(0.8, 2.4)
      });
    }
    if (sparks.length > 1400) sparks.splice(0, sparks.length - 1400);
  }

  /* ---------- Vòng lặp vẽ ---------- */
  function frame(now) {
    const t = now * 0.001;        // thời gian cho nebula
    const ft = now * 0.00018;     // thời gian cho flow field

    /* 1. Làm mờ khung trước → tạo vệt (trail) */
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "rgba(5, 6, 13, 0.055)";
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = "lighter";

    /* 2. Các đám mây màu nền */
    const maxDim = Math.max(W, H);
    for (const b of blobs) {
      b.angle += b.spin;
      const cx = W * 0.5 + Math.cos(b.angle) * W * b.rx +
                 Math.sin(t * 0.7 * b.speed + b.phase) * W * 0.05;
      const cy = H * 0.5 + Math.sin(b.angle * 0.9 + b.phase) * H * b.ry +
                 Math.cos(t * 0.6 * b.speed + b.phase) * H * 0.05;
      const r = maxDim * b.size;

      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      g.addColorStop(0,    `hsla(${b.hue}, 95%, 62%, 0.020)`);
      g.addColorStop(0.55, `hsla(${b.hue}, 95%, 55%, 0.009)`);
      g.addColorStop(1,    "hsla(0, 0%, 0%, 0)");
      ctx.fillStyle = g;
      ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
    }

    /* 3. Hạt chảy theo flow field */
    const R = 170, R2 = R * R;

    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];

      const a = field(p.x, p.y, ft);
      let vx = Math.cos(a) * p.speed;
      let vy = Math.sin(a) * p.speed;

      // Đẩy ra khỏi con trỏ
      if (mouse.active) {
        const dx = p.x - mouse.x;
        const dy = p.y - mouse.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < R2 && d2 > 0.0001) {
          const d = Math.sqrt(d2);
          const f = (1 - d / R) * 7;
          vx += (dx / d) * f;
          vy += (dy / d) * f;
        }
      }

      p.px = p.x;
      p.py = p.y;
      p.x += vx;
      p.y += vy;

      // Ra khỏi màn hình → tái sinh (tránh vệt kéo ngang)
      if (p.x < -4 || p.x > W + 4 || p.y < -4 || p.y > H + 4) {
        p.x = Math.random() * W;
        p.y = Math.random() * H;
        p.px = p.x;
        p.py = p.y;
        continue;
      }

      ctx.strokeStyle = `hsla(${p.hue}, 100%, 66%, ${p.alpha})`;
      ctx.lineWidth = p.width;
      ctx.beginPath();
      ctx.moveTo(p.px, p.py);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }

    /* 4. Tia lửa từ cú click */
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.px = s.x;
      s.py = s.y;
      s.x += s.vx;
      s.y += s.vy;
      s.vx *= 0.96;
      s.vy *= 0.96;
      s.life -= s.decay;

      if (s.life <= 0) {
        sparks.splice(i, 1);
        continue;
      }

      ctx.strokeStyle = `hsla(${s.hue}, 100%, ${62 + 28 * s.life}%, ${s.life})`;
      ctx.lineWidth = s.width * s.life;
      ctx.beginPath();
      ctx.moveTo(s.px, s.py);
      ctx.lineTo(s.x, s.y);
      ctx.stroke();
    }

    /* 5. Quầng sáng quanh con trỏ */
    if (mouse.active) {
      const r2 = 170;
      const g = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, r2);
      g.addColorStop(0,   "hsla(195, 100%, 72%, 0.026)");
      g.addColorStop(0.45,"hsla(265, 100%, 68%, 0.014)");
      g.addColorStop(1,   "hsla(0, 0%, 0%, 0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(mouse.x, mouse.y, r2, 0, TAU);
      ctx.fill();
    }

    requestAnimationFrame(frame);
  }

  /* ---------- Sự kiện ---------- */
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", () => setTimeout(resize, 120));

  window.addEventListener("pointermove", (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
  }, { passive: true });

  window.addEventListener("pointerdown", (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
    burst(e.clientX, e.clientY);
  }, { passive: true });

  window.addEventListener("pointerleave", () => {
    mouse.active = false;
    mouse.x = -9999;
    mouse.y = -9999;
  });

  window.addEventListener("blur", () => {
    mouse.active = false;
  });

  /* ---------- Khởi động ---------- */
  resize();
  requestAnimationFrame(frame);

  setTimeout(() => { hint.style.opacity = "0"; }, 7000);
})();
</script>
</body>
</html>
