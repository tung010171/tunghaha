<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title></title>

<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  #tubes-root {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #000;
  }

  #tubes-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 1;
  }

  #center-stage {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.6em;
    z-index: 10;
    pointer-events: none;
    transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1),
                filter 1s ease;
    will-change: opacity, filter;
  }
  #center-stage.leaving {
    opacity: 0;
    filter: blur(14px);
  }

  .title-wrap {
    position: relative;
    overflow: hidden;
    display: inline-block;
    padding: 0.1em 0.2em;
  }

  .title-wrap::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(45deg, rgba(255,255,255,.03) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(-45deg, rgba(0,0,0,.05) 0 1px, transparent 1px 3px);
    mix-blend-mode: overlay;
    pointer-events: none;
    z-index: 2;
  }

  .title-wrap::after {
    content: "";
    position: absolute;
    inset: -20% -10%;
    background:
      linear-gradient(115deg, transparent 35%, rgba(255,255,255,.9) 48%, #fff 50%, rgba(255,255,255,.9) 52%, transparent 65%),
      repeating-linear-gradient(115deg, rgba(255,255,255,.15) 0 2px, transparent 2px 6px);
    background-blend-mode: overlay;
    transform: translateX(-120%);
    animation: shine 3s ease-in-out infinite;
    mix-blend-mode: overlay;
    pointer-events: none;
    z-index: 3;
  }

  @keyframes shine {
    0%, 60% { transform: translateX(-120%); }
    85%     { transform: translateX( 120%); }
    100%    { transform: translateX( 120%); }
  }

  /* 🔽 CHỮ TIÊU ĐỀ CHÍNH */
  .title {
    display: flex;
    gap: 0.03em;
    margin: 0;
    font-size: clamp(20px, 4vw, 48px);
    font-weight: 700;
    line-height: 1;
    letter-spacing: 0.04em;
    color: #eaeaf4;
    text-shadow:
      0 0 8px rgba(56,189,248,.6),
      0 0 20px rgba(56,189,248,.3);
    user-select: none;
  }

  .title span {
    display: inline-block;
    animation: glitchShift 3s infinite steps(1);
  }

  @keyframes glitchShift {
    0%, 85%, 100% { transform: translate(0, 0); }
    87%  { transform: translate(-3px,  1px); }
    89%  { transform: translate( 3px, -1px); }
    91%  { transform: translate(-2px,  2px); }
    93%  { transform: translate( 2px, -2px); }
    95%  { transform: translate(-1px, -1px); }
  }

  #fade-overlay {
    position: fixed;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    z-index: 50;
    transition: opacity 0.6s ease;
  }
  #fade-overlay.active { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .title span { animation: none; }
    .title-wrap::after { animation: none; }
  }
</style>
</head>
<body>

<div id="tubes-root">
  <canvas id="tubes-canvas" aria-hidden="true"></canvas>

  <div id="center-stage">
    <div class="title-wrap">
      <p class="title" id="title-text">chuyển trang sau 3 giây</p>
    </div>
  </div>
</div>

<div id="fade-overlay"></div>

<script>
  // 1. TÁCH CHỮ AN TOÀN CHO HIỆU ỨNG GLITCH
  try {
    const titleEl = document.getElementById('title-text');
    if (titleEl) {
      const text = titleEl.textContent;
      titleEl.textContent = '';
      [...text].forEach((char, i) => {
        const span = document.createElement('span');
        span.textContent = char === ' ' ? '\u00A0' : char;
        span.style.animationDelay = (0.15 * i) + 's';
        titleEl.appendChild(span);
      });
    }
  } catch (err) {
    console.error("Lỗi tách chữ:", err);
  }

  // 2. HIỆU ỨNG MỜ DẦN SAU 3 GIÂY (KHÔNG CHUYỂN TRANG)
  setTimeout(() => {
    const stage = document.getElementById('center-stage');
    const overlay = document.getElementById('fade-overlay');

    if (stage) stage.classList.add('leaving');
    setTimeout(() => {
      if (overlay) overlay.classList.add('active');
    }, 450);

    // ⛔ Muốn chuyển trang thật thì bỏ dấu comment `//` ở dòng dưới và thay liên kết:
    // setTimeout(() => {
    //   window.location.href = 'https://your-url.com';
    // }, 1000);

  }, 3000);

  // 3. TẢI BACKGROUND 3D
  (async function loadBackground() {
    try {
      const cdns = [
        'https://cdn.jsdelivr.net/npm/threejs-components@0.0.19/build/cursors/tubes1.min.js',
        'https://unpkg.com/threejs-components@0.0.19/build/cursors/tubes1.min.js'
      ];

      let TubesCursor = null;
      for (const url of cdns) {
        try {
          const mod = await import(url);
          TubesCursor = mod.default || mod.TubesCursor || window.TubesCursor;
          if (TubesCursor) break;
        } catch (e) {
          console.warn("Thử CDN thất bại:", url);
        }
      }

      if (TubesCursor) {
        TubesCursor(document.getElementById('tubes-canvas'), {
          tubes: {
            colors: ["#f967fb", "#53bc28", "#6958d5"],
            lights: { intensity: 200, colors: ["#83f36e", "#fe8a2e", "#ff008a", "#60aed5"] }
          }
        });
      }
    } catch (err) {
      console.log("Không tải được background 3D.");
    }
  })();
</script>

</body>
</html>
