<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Rotate Loader nhỏ gọn</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #050813;
    overflow: hidden;
    position: relative;
  }

  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.35;
    animation: float 14s ease-in-out infinite;
  }
  .blob-1 { width: 380px; height: 380px; background: #a855f7; top: -80px; left: -80px; }
  .blob-2 { width: 320px; height: 320px; background: #22d3ee; bottom: -60px; right: -60px; animation-delay: 4s; }
  .blob-3 { width: 280px; height: 280px; background: #ec4899; top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: 8s; }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33%      { transform: translate(50px, -40px) scale(1.15); }
    66%      { transform: translate(-40px, 30px) scale(0.9); }
  }

  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(168, 85, 247, 0.15) 1px, transparent 1px);
    background-size: 24px 24px;
    z-index: 1;
    pointer-events: none;
  }

  /* ====== THU NHỎ Ở ĐÂY ====== */
  .loader-wrap {
    position: relative;
    width: 160px;
    height: 160px;
    transform: scale(0.5);           /* 👈 đổi số này để to/nhỏ */
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .loader-wrap::before {
    content: '';
    position: absolute;
    inset: -30px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(168, 85, 247, 0.35), transparent 70%);
    animation: glowPulse 2.5s ease-in-out infinite;
    z-index: -1;
  }

  @keyframes glowPulse {
    0%, 100% { transform: scale(1); opacity: 0.7; }
    50%      { transform: scale(1.15); opacity: 1; }
  }

  .ring-outer {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(from 0deg,
      transparent 0%, #a855f7 25%, transparent 50%,
      #22d3ee 75%, transparent 100%);
    -webkit-mask: radial-gradient(farthest-side, transparent 82%, #000 84%);
    mask: radial-gradient(farthest-side, transparent 82%, #000 84%);
    animation: spinSlow 4s linear infinite;
    filter: drop-shadow(0 0 12px #a855f7) drop-shadow(0 0 24px #22d3ee);
  }

  .ring-mid {
    position: absolute;
    inset: 20px;
    border-radius: 50%;
    background: conic-gradient(from 90deg,
      transparent 0%, #ec4899 30%, transparent 60%,
      #f59e0b 90%, transparent 100%);
    -webkit-mask: radial-gradient(farthest-side, transparent 78%, #000 80%);
    mask: radial-gradient(farthest-side, transparent 78%, #000 80%);
    animation: spinFast 2.5s linear infinite reverse;
    filter: drop-shadow(0 0 10px #ec4899) drop-shadow(0 0 20px #f59e0b);
  }

  .ring-inner {
    position: absolute;
    inset: 42px;
    border-radius: 50%;
    border: 3px solid transparent;
    border-top-color: #22d3ee;
    border-right-color: #a855f7;
    animation: spinFast 1.4s cubic-bezier(0.6, 0.05, 0.4, 0.95) infinite;
    filter: drop-shadow(0 0 8px #22d3ee);
  }

  @keyframes spinSlow { to { transform: rotate(360deg); } }
  @keyframes spinFast { to { transform: rotate(360deg); } }

  .core {
    position: absolute;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: radial-gradient(circle, #ffffff, #a855f7 60%, transparent);
    animation: corePulse 1.6s ease-in-out infinite;
    box-shadow: 0 0 20px #a855f7, 0 0 40px #a855f7;
  }

  @keyframes corePulse {
    0%, 100% { transform: scale(1); opacity: 0.85; }
    50%      { transform: scale(1.4); opacity: 1; }
  }

  .particle {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #22d3ee;
    box-shadow: 0 0 10px #22d3ee;
    top: 50%;
    left: 50%;
    transform-origin: 0 0;
    animation: orbit 3s linear infinite;
  }
  .particle:nth-child(2) { animation-delay: -1s; background: #ec4899; box-shadow: 0 0 10px #ec4899; }
  .particle:nth-child(3) { animation-delay: -2s; background: #f59e0b; box-shadow: 0 0 10px #f59e0b; }

  @keyframes orbit {
    from { transform: rotate(0deg) translateX(80px) rotate(0deg); }
    to   { transform: rotate(360deg) translateX(80px) rotate(-360deg); }
  }
</style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="loader-wrap">
    <div class="ring-outer"></div>
    <div class="ring-mid"></div>
    <div class="ring-inner"></div>
    <div class="core"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

</body>
</html>
