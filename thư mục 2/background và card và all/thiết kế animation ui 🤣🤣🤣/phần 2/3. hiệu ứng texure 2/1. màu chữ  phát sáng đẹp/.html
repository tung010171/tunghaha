<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Neon Text Effect — Blue</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #05050a;
    font-family: 'Impact', 'Arial Black', sans-serif;
    overflow: hidden;
  }

  .neon {
    font-size: clamp(3rem, 14vw, 11rem);
    font-weight: 900;
    color: #fff;
    letter-spacing: 0.05em;
    text-shadow:
      0 0 8px   #fff,
      0 0 20px  #38bdf8,
      0 0 40px  #38bdf8,
      0 0 80px  #0ea5e9,
      0 0 120px #0284c7;
    animation: flicker 2s infinite alternate;
  }

  @keyframes flicker {
    0%, 18%, 22%, 25%, 53%, 57%, 100% {
      text-shadow:
        0 0 8px   #fff,
        0 0 20px  #38bdf8,
        0 0 40px  #38bdf8,
        0 0 80px  #0ea5e9,
        0 0 120px #0284c7;
      opacity: 1;
    }
    20%, 24%, 55% {
      text-shadow: none;
      opacity: 0.6;
    }
  }
</style>
</head>
<body>

  <div class="neon">NEON</div>

</body>
</html>
