<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Glitch Shift</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #05050a;
    font-family: 'Impact', 'Arial Black', sans-serif;
    overflow: hidden;
  }

  .glitch {
    display: flex;
    gap: 0.03em;
    font-size: clamp(3rem, 15vw, 12rem);
    font-weight: 900;
    color: #e8e8f0;
    letter-spacing: 0.02em;
  }

  .glitch span {
    display: inline-block;
    animation: glitchShift 3s infinite steps(1);
  }

  /* Mỗi chữ lệch pha để giật không đều nhau */
  .glitch span:nth-child(1) { animation-delay: 0s; }
  .glitch span:nth-child(2) { animation-delay: 0.3s; }
  .glitch span:nth-child(3) { animation-delay: 0.6s; }
  .glitch span:nth-child(4) { animation-delay: 0.9s; }
  .glitch span:nth-child(5) { animation-delay: 1.2s; }
  .glitch span:nth-child(6) { animation-delay: 1.5s; }

  @keyframes glitchShift {
    0%, 85%, 100% { transform: translate(0, 0); }
    87% { transform: translate(-3px, 1px); }
    89% { transform: translate(3px, -1px); }
    91% { transform: translate(-2px, 2px); }
    93% { transform: translate(2px, -2px); }
    95% { transform: translate(-1px, -1px); }
  }
</style>
</head>
<body>

  <div class="glitch">
    <span>G</span>
    <span>L</span>
    <span>I</span>
    <span>T</span>
    <span>C</span>
    <span>H</span>
  </div>

</body>
</html>
