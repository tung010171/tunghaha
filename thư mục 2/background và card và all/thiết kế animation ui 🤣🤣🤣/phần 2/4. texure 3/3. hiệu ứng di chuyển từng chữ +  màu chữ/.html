<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Color Wave — RGB Split Blue</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #05050a;
    font-family: 'Impact', 'Arial Black', sans-serif;
    overflow: hidden;
  }

  .text {
    display: flex;
    gap: 0.05em;
    font-size: clamp(3rem, 15vw, 10rem);
    font-weight: 900;
    color: #1a1a2e;
  }

  .text span {
    position: relative;
    display: inline-block;
    transition: color 0.4s ease, text-shadow 0.4s ease;
  }

  /* Lớp xanh lơ — lệch trái */
  .text span::before {
    content: attr(data-char);
    position: absolute;
    inset: 0;
    color: #00e5ff;
    transform: translate(-4px, 0);
    z-index: -1;
    opacity: 0;
    transition: opacity 0.4s ease;
    mix-blend-mode: screen;
  }

  /* Lớp xanh đậm — lệch phải */
  .text span::after {
    content: attr(data-char);
    position: absolute;
    inset: 0;
    color: #0284c7;
    transform: translate(4px, 0);
    z-index: -1;
    opacity: 0;
    transition: opacity 0.4s ease;
    mix-blend-mode: screen;
  }

  /* Khi active — chữ sáng neon xanh + 2 lớp RGB hiện lên */
  .text span.active {
    color: #fff;
    text-shadow:
      0 0 10px #fff,
      0 0 25px #38bdf8,
      0 0 50px #0ea5e9,
      0 0 80px #0284c7;
  }
  .text span.active::before { opacity: 0.9; }
  .text span.active::after  { opacity: 0.9; }
</style>
</head>
<body>

  <div class="text" id="text">
    <span data-char="B">B</span>
    <span data-char="L">L</span>
    <span data-char="U">U</span>
    <span data-char="E">E</span>
  </div>

<script>
  const spans = document.querySelectorAll('.text span');
  let i = 0;

  setInterval(() => {
    spans.forEach(s => s.classList.remove('active'));
    spans[i].classList.add('active');
    i = (i + 1) % spans.length;
  }, 600);
</script>
</body>
</html>
