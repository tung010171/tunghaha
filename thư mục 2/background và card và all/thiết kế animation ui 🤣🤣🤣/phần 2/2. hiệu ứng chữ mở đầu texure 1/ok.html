<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Staggered Text Reveal</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0a12;
    overflow: hidden;
    font-family: 'Arial Black', sans-serif;
  }

  .text {
    display: flex;
    gap: 0.05em;
    font-size: clamp(3rem, 14vw, 10rem);
    font-weight: 900;
    color: #fff;
    letter-spacing: 0.02em;
  }

  .text span {
    display: inline-block;
    opacity: 0;
    transform: translateY(120px) rotate(-8deg);
    animation: reveal 0.9s cubic-bezier(0.2, 0.9, 0.3, 1.4) forwards;
    background: linear-gradient(180deg, #ff5c8a, #a855f7, #38bdf8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 20px rgba(168,85,247,0.6));
  }

  /* 👇 ĐÂY LÀ PHẦN STAGGER — mỗi chữ lệch nhau 0.1s */
  .text span:nth-child(1) { animation-delay: 0.1s; }
  .text span:nth-child(2) { animation-delay: 0.2s; }
  .text span:nth-child(3) { animation-delay: 0.3s; }
  .text span:nth-child(4) { animation-delay: 0.4s; }
  .text span:nth-child(5) { animation-delay: 0.5s; }
  .text span:nth-child(6) { animation-delay: 0.6s; }
  .text span:nth-child(7) { animation-delay: 0.7s; }
  .text span:nth-child(8) { animation-delay: 0.8s; }

  @keyframes reveal {
    0% {
      opacity: 0;
      transform: translateY(120px) rotate(-8deg) scale(0.8);
    }
    100% {
      opacity: 1;
      transform: translateY(0) rotate(0) scale(1);
    }
  }
</style>
</head>
<body>

  <div class="text">
    <span>S</span>
    <span>T</span>
    <span>A</span>
    <span>G</span>
    <span>G</span>
    <span>E</span>
    <span>R</span>
    <span>!</span>
  </div>

</body>
</html>
