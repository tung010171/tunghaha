<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Liquid Fill</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #0a0e1a;
    font-family: 'Segoe UI', sans-serif;
  }

  .liquid {
    position: relative;
    padding: 1rem 2.6rem;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #fff;
    background: transparent;
    border: 2px solid #a855f7;
    border-radius: 8px;
    cursor: pointer;
    overflow: hidden;   /* giữ khối màu trong nút */
    z-index: 1;
  }

  /* Khối chất lỏng */
  .liquid::before {
    content: "";
    position: absolute;
    left: 0;
    bottom: 0;          /* neo đáy */
    width: 100%;
    height: 0;          /* ban đầu cao 0 */
    background: linear-gradient(180deg, #a855f7, #ec4899);
    transition: height 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: -1;        /* nằm dưới chữ */
  }

  /* Hover → dâng đầy */
  .liquid:hover::before {
    height: 100%;
  }
</style>
</head>
<body>

  <button class="liquid">Liquid Fill</button>

</body>
</html>
