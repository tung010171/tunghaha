<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Glitch Text</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #0a0e1a;
    font-family: 'Segoe UI', sans-serif;
  }

  /* ===== CHỮ GỐC ===== */
  .glitch {
    position: relative;
    font-size: clamp(3rem, 14vw, 9rem);
    font-weight: 900;
    letter-spacing: 0.05em;
    color: #fff;
  }

  /* ===== 2 LỚP PHỦ ===== */
  .glitch::before,
  .glitch::after {
    content: attr(data-text);
    position: absolute;
    inset: 0;
  }

  /* Lớp cyan — cắt nửa trên */
  .glitch::before {
    color: #22d3ee;
    clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
    animation: glitchShift 2s infinite;
  }

  /* Lớp hồng — cắt nửa dưới, chạy ngược */
  .glitch::after {
    color: #ec4899;
    clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
    animation: glitchShift 2s infinite reverse;
  }

  /* ===== GIẬT QUA LẠI ===== */
  @keyframes glitchShift {
    0%, 100% { transform: translate(0, 0); }
    20%      { transform: translate(-3px, 2px); }
    40%      { transform: translate(3px, -2px); }
    60%      { transform: translate(-2px, -1px); }
    80%      { transform: translate(2px, 1px); }
  }
</style>
</head>
<body>

  <h1 class="glitch" data-text="GLITCH">GLITCH</h1>

</body>
</html>
