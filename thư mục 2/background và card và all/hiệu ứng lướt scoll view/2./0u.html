<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fractal Shatter Gate - Scroll Reveal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #030308;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 300vh; /* Khoảng không gian cuộn */
            overflow-x: hidden;
        }

        /* Khung màn hình hiển thị cố định */
        .viewport {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* Background Canvas cho hiệu ứng ảo giác */
        #gl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Vùng nội dung chung */
        .section-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            pointer-events: none;
        }

        /* SECTION 1: Nằm dưới màn chắn mảnh vỡ */
        #sec1 {
            z-index: 2;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        #sec1 h1 {
            font-size: 3.5rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #00f3ff, #ff0055);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(0, 243, 255, 0.4);
        }

        /* LỚP MẢNH VỠ PHÂN MẢNH (SHATTER GRID) */
        #shatter-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            pointer-events: none;
            perspective: 1000px;
        }

        .shard {
            background: rgba(10, 10, 25, 0.95);
            border: 1px solid rgba(0, 243, 255, 0.2);
            backdrop-filter: blur(12px);
            transition: transform 0.1s linear, opacity 0.1s linear, filter 0.1s linear;
            transform-origin: center center;
        }

        /* SECTION 2: Nội dung ẩn được giải phóng đằng sau */
        #sec2 {
            z-index: 4;
            opacity: 0;
            transform: scale(0.8);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        #sec2 .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 0, 85, 0.3);
            box-shadow: 0 0 50px rgba(255, 0, 85, 0.2);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(20px);
            max-width: 650px;
        }

        #sec2 h2 {
            font-size: 2.8rem;
            color: #ff0055;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        #sec2 p {
            color: #a0aec0;
            font-size: 1.2rem;
            line-height: 1.6;
        }

        /* Gợi ý cuộn */
        .scroll-indicator {
            position: absolute;
            bottom: 30px;
            color: #00f3ff;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.4; transform: translateY(0); }
            100% { opacity: 1; transform: translateY(-8px); }
        }
    </style>
</head>
<body>

    <div class="viewport">
        <!-- Canvas ảo giác hạt background -->
        <canvas id="gl-canvas"></canvas>

        <!-- Section 1 -->
        <div class="section-content" id="sec1">
            <h1>CỔNG THỜI KHÔNG</h1>
            <p style="color: #8892b0; max-width: 500px;">Lướt cuộn chuột để phá vỡ cấu trúc không gian và giải phóng nội dung bí mật bên dưới.</p>
            <div class="scroll-indicator">↓ LƯỚT XUỐNG ĐỂ MỞ CỔNG ↓</div>
        </div>

        <!-- Màn chắn mảnh vỡ (Shatter Overlay) -->
        <div id="shatter-overlay"></div>

        <!-- Section 2 (Mục tiêu mở khóa) -->
        <div class="section-content" id="sec2">
            <div class="card">
                <h2>THỰC TẠI MỚI</h2>
                <p>Bạn đã bẻ cong thành công ma trận không gian. Các mảnh vỡ thực tại tách rời để lộ ra khoảng không gian dữ liệu hoàn toàn mới.</p>
            </div>
        </div>
    </div>

    <script>
        // 1. Khởi tạo 16 mảnh vỡ 3D (Shatter Grid)
        const overlay = document.getElementById('shatter-overlay');
        const rows = 4, cols = 4;
        const shards = [];

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const shard = document.createElement('div');
                shard.classList.add('shard');
                
                // Gán hướng văng ngẫu nhiên cho từng mảnh khi cuộn
                const angle = Math.atan2(r - 1.5, c - 1.5);
                const distance = Math.hypot(r - 1.5, c - 1.5) + 0.5;
                
                shard.dataset.dirX = Math.cos(angle) * distance * 300;
                shard.dataset.dirY = Math.sin(angle) * distance * 300;
                shard.dataset.rotX = (Math.random() - 0.5) * 720;
                shard.dataset.rotY = (Math.random() - 0.5) * 720;

                overlay.appendChild(shard);
                shards.push(shard);
            }
        }

        // 2. Canvas 2D Hiệu ứng xoáy ảo giác background
        const canvas = document.getElementById('gl-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let particles = Array.from({ length: 80 }, () => ({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 3 + 1,
            speedX: (Math.random() - 0.5) * 2,
            speedY: (Math.random() - 0.5) * 2
        }));

        let globalWarp = 0;

        function renderCanvas() {
            ctx.fillStyle = 'rgba(3, 3, 8, 0.2)';
            ctx.fillRect(0, 0, width, height);

            ctx.strokeStyle = `rgba(0, 243, 255, ${0.1 + globalWarp * 0.4})`;
            ctx.lineWidth = 1 + globalWarp * 3;

            particles.forEach(p => {
                p.x += p.speedX * (1 + globalWarp * 5);
                p.y += p.speedY * (1 + globalWarp * 5);

                if (p.x < 0) p.x = width;
                if (p.x > width) p.x = 0;
                if (p.y < 0) p.y = height;
                if (p.y > height) p.y = 0;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * (1 + globalWarp), 0, Math.PI * 2);
                ctx.fillStyle = globalWarp > 0.5 ? '#ff0055' : '#00f3ff';
                ctx.fill();
            });

            requestAnimationFrame(renderCanvas);
        }
        renderCanvas();

        // 3. Xử lý Logic Scroll Driven Transition
        const sec1 = document.getElementById('sec1');
        const sec2 = document.getElementById('sec2');

        window.addEventListener('scroll', () => {
            const scrollTop = window.scrollY;
            const maxScroll = window.innerHeight * 1.2;
            let progress = Math.min(Math.max(scrollTop / maxScroll, 0), 1);

            globalWarp = progress;

            // Biến đổi các mảnh vỡ văng ra 3D
            shards.forEach(shard => {
                const moveX = shard.dataset.dirX * progress;
                const moveY = shard.dataset.dirY * progress;
                const rotX = shard.dataset.rotX * progress;
                const rotY = shard.dataset.rotY * progress;
                const opacity = 1 - progress;

                shard.style.transform = `translate3d(${moveX}px, ${moveY}px, ${progress * 500}px) rotateX(${rotX}deg) rotateY(${rotY}deg)`;
                shard.style.opacity = opacity;
                shard.style.filter = `hue-rotate(${progress * 180}deg)`;
            });

            // Làm mờ Section 1
            sec1.style.opacity = 1 - progress * 1.5;
            sec1.style.transform = `scale(${1 - progress * 0.3})`;

            // Hiện rõ Section 2 khi cuộn gần hoàn tất
            if (progress > 0.4) {
                const sec2Progress = (progress - 0.4) / 0.6;
                sec2.style.opacity = sec2Progress;
                sec2.style.transform = `scale(${0.8 + sec2Progress * 0.2})`;
            } else {
                sec2.style.opacity = 0;
                sec2.style.transform = `scale(0.8)`;
            }
        });
    </script>
</body>
</html>
