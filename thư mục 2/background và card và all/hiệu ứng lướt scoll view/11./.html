<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll Card Stack - 60fps</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #050508;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 300vh; /* Tạo không gian cuộn dài */
            overflow-x: hidden;
        }

        .viewport {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        .card-container {
            position: relative;
            width: 100%;
            max-width: 580px;
            height: 380px;
        }

        .card-item {
            position: absolute;
            inset: 0;
            background: rgba(18, 18, 26, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            backdrop-filter: blur(20px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
            will-change: transform, opacity;
        }

        /* Thẻ 1 nằm trên */
        #card1 {
            z-index: 2;
            transform-origin: top center;
        }

        /* Thẻ 2 nằm dưới chờ sẵn */
        #card2 {
            z-index: 1;
            transform: scale(0.9) translateY(40px);
            opacity: 0.3;
        }

        .card-item h3 {
            font-size: 1.8rem;
            margin-bottom: 12px;
            color: #ffffff;
        }

        .card-item p {
            color: #a1a1aa;
            line-height: 1.6;
            font-size: 1.05rem;
        }
    </style>
</head>
<body>

    <div class="viewport">
        <div class="card-container">
            <!-- Thẻ Layer 1 -->
            <div class="card-item" id="card1">
                <h3>Thẻ Giao Diện Thứ Nhất</h3>
                <p>Khi bạn cuộn chuột, thẻ này sẽ tự động thu nhỏ tỷ lệ, ngả nhẹ về phía sau và mờ dần đi, tạo chiều sâu không gian 3 chiều thuần túy.</p>
            </div>
            
            <!-- Thẻ Layer 2 -->
            <div class="card-item" id="card2">
                <h3>Thẻ Giao Diện Thứ Hai</h3>
                <p>Được hé lộ mượt mà từ lớp phía dưới, khớp hoàn hảo với từng nhịp kéo chuột mà không tốn tài nguyên chạy ngầm.</p>
            </div>
        </div>
    </div>

    <script>
        const card1 = document.getElementById('card1');
        const card2 = document.getElementById('card2');

        window.addEventListener('scroll', () => {
            const scrollTop = window.scrollY;
            const maxScroll = window.innerHeight * 1.5;
            let progress = Math.min(Math.max(scrollTop / maxScroll, 0), 1);

            // Thẻ 1 thu nhỏ, trượt lên và mờ dần
            card1.style.transform = `scale(${1 - progress * 0.15}) translateY(-${progress * 60}px)`;
            card1.style.opacity = 1 - progress * 1.2;

            // Thẻ 2 nổi dần lên thay thế vị trí
            card2.style.transform = `scale(${0.9 + progress * 0.1}) translateY(${(1 - progress) * 40}px)`;
            card2.style.opacity = 0.3 + progress * 0.7;
        });
    </script>
</body>
</html>
