<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Card trống</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}

  body{
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:40px 20px;
    background:#07070d;
    overflow-x:hidden;
  }

  /* Nền phía sau để thấy hiệu ứng kính */
  .stage{
    position:fixed;inset:0;z-index:-1;overflow:hidden;
    background:radial-gradient(ellipse at 50% 0%, #16162c 0%, #07070d 60%);
  }
  .orb{
    position:absolute;border-radius:50%;filter:blur(90px);
    opacity:.55;
  }
  .orb-1{width:420px;height:420px;background:#7c5cff;top:-80px;left:-80px}
  .orb-2{width:380px;height:380px;background:#22d3ee;bottom:-100px;right:-60px;opacity:.45}
  .orb-3{width:300px;height:300px;background:#f472b6;top:45%;left:60%;opacity:.35}

  /* ===== GLASS CARD ===== */
  .card{
    width:100%;max-width:520px;
    min-height:220px;
    padding:26px;
    border-radius:22px;

    background:linear-gradient(165deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.14);
    backdrop-filter:blur(22px) saturate(160%);
    -webkit-backdrop-filter:blur(22px) saturate(160%);
    box-shadow:
      0 25px 60px -20px rgba(0,0,0,.7),
      inset 0 1px 0 rgba(255,255,255,.18);
  }
</style>
</head>
<body>

<!-- Nền để thấy kính mờ -->
<div class="stage">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<!-- Card kính trống -->
<div class="card"></div>

</body>
</html>
