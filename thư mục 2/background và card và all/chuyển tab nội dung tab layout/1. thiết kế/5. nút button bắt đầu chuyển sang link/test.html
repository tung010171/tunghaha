<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Card + Neon Button</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}

  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:40px 20px;background:#07070d;color:#eaeaf4;
    font-family:system-ui,sans-serif;overflow-x:hidden;
  }

  /* ===== NỀN PHÍA SAU ===== */
  .stage{
    position:fixed;inset:0;z-index:-1;overflow:hidden;
    background:radial-gradient(ellipse at 50% 0%, #16162c 0%, #07070d 60%);
  }
  .orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55}
  .orb-1{width:420px;height:420px;background:#7c5cff;top:-80px;left:-80px}
  .orb-2{width:380px;height:380px;background:#22d3ee;bottom:-100px;right:-60px;opacity:.45}

  /* ===== GLASS CARD ===== */
  .card{
    width:100%;max-width:600px;min-height:280px;
    padding:24px;border-radius:22px;

    background:linear-gradient(165deg,
      rgba(255,255,255,.10),
      rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.14);

    backdrop-filter:blur(22px) saturate(160%);
    -webkit-backdrop-filter:blur(22px) saturate(160%);

    box-shadow:
      0 25px 60px -20px rgba(0,0,0,.7),
      inset 0 1px 0 rgba(255,255,255,.18);
  }

  /* ===== TAB WRAP ===== */
  .tab-wrap{
    padding:5px;border-radius:100px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);
    box-shadow:inset 0 1px 2px rgba(0,0,0,.4);
  }

  /* ===== TAB LIST ===== */
  .tab-list{
    position:relative;display:flex;gap:4px;
    overflow-x:auto;overflow-y:hidden;
    scroll-behavior:smooth;
    scrollbar-width:none;-ms-overflow-style:none;
    border-radius:100px;
  }
  .tab-list::-webkit-scrollbar{display:none;width:0;height:0}

  /* ===== INDICATOR ===== */
  .indicator{
    position:absolute;top:0;left:0;height:100%;width:0;
    border-radius:100px;
    background:linear-gradient(135deg,#7c5cff,#5b8cff);
    box-shadow:0 8px 20px -8px rgba(124,92,255,.9);
    transition:transform .4s ease, width .4s ease;
    pointer-events:none;
  }

  /* ===== TAB BUTTON ===== */
  .tab-btn{
    position:relative;z-index:1;flex:0 0 auto;min-width:80px;
    padding:10px 16px;font:inherit;font-weight:600;font-size:14px;
    color:#8b8ba3;background:none;border:0;border-radius:100px;
    cursor:pointer;white-space:nowrap;
    -webkit-tap-highlight-color:transparent;
    transition:color .3s ease;
  }
  .tab-btn.is-active{color:#fff}

  /* ===== PANEL ===== */
  .tab-panel{display:none;margin-top:18px}
  .tab-panel.is-active{
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    min-height:160px;
  }

  /* ===== NEON ACTION BUTTON ===== */
  .action-btn{
    display:inline-flex;
    align-items:center;
    padding:14px 32px;
    font:inherit;font-size:15px;font-weight:700;
    letter-spacing:.02em;
    text-decoration:none;
    border-radius:100px;

    /* Nền tối trong suốt để neon nổi rõ */
    background:rgba(10,20,40,.35);
    border:1px solid rgba(56,189,248,.5);
    box-shadow:
      0 0 12px rgba(56,189,248,.5),
      0 0 30px rgba(56,189,248,.25),
      inset 0 0 12px rgba(56,189,248,.15);

    transition:transform .2s ease, box-shadow .25s ease;
  }
  .action-btn:hover{
    transform:translateY(-2px);
    box-shadow:
      0 0 18px rgba(56,189,248,.75),
      0 0 44px rgba(56,189,248,.4),
      inset 0 0 16px rgba(56,189,248,.25);
  }
  .action-btn:active{
    transform:translateY(0);
  }

  /* Mỗi chữ — vừa reveal vừa nhấp nháy neon */
  .action-btn .ch{
    display:inline-block;
    color:#fff;
    text-shadow:
      0 0 6px  #fff,
      0 0 14px #38bdf8,
      0 0 28px #38bdf8,
      0 0 50px #0ea5e9;

    opacity:0;
    transform:translateY(60%);
    animation:
      chReveal .5s cubic-bezier(.2,.9,.3,1.4) forwards,
      neonFlicker 2.2s ease-in-out infinite alternate;
  }

  @keyframes chReveal{
    to{ opacity:1; transform:translateY(0); }
  }

  @keyframes neonFlicker{
    0%, 18%, 22%, 100%{
      text-shadow:
        0 0 6px  #fff,
        0 0 14px #38bdf8,
        0 0 28px #38bdf8,
        0 0 50px #0ea5e9;
    }
    20%{ text-shadow:none; }
  }

  @media (prefers-reduced-motion: reduce){
    .action-btn .ch{
      animation:chReveal .01s forwards;
      opacity:1; transform:none;
      text-shadow:
        0 0 6px  #fff,
        0 0 14px #38bdf8,
        0 0 28px #38bdf8,
        0 0 50px #0ea5e9;
    }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
</div>

<div class="card">
  <div class="tab-wrap">
    <div class="tab-list" role="tablist" id="tabList">
      <span class="indicator" id="indicator" aria-hidden="true"></span>
      <button class="tab-btn is-active" role="tab">Tab 1</button>
      <button class="tab-btn" role="tab">Tab 2</button>
      <button class="tab-btn" role="tab">Tab 3</button>
      <button class="tab-btn" role="tab">Tab 4</button>
      <button class="tab-btn" role="tab">Tab 5</button>
      <button class="tab-btn" role="tab">Tab 6</button>
    </div>
  </div>

  <div class="tab-panel is-active">
    <a class="action-btn" href="https://tung010171.github.io/tunghaha/"
       target="_blank" rel="noopener" data-text="Nhấn vào đây"></a>
  </div>
  <div class="tab-panel">
    <a class="action-btn" href="https://tung010171.github.io/tunghaha/"
       target="_blank" rel="noopener" data-text="Nhấn vào đây"></a>
  </div>
  <div class="tab-panel">
    <a class="action-btn" href="https://tung010171.github.io/tunghaha/"
       target="_blank" rel="noopener" data-text="Nhấn vào đây"></a>
  </div>
  <div class="tab-panel">
    <a class="action-btn" href="https://tung010171.github.io/tunghaha/"
       target="_blank" rel="noopener" data-text="Nhấn vào đây"></a>
  </div>
  <div class="tab-panel">
    <a class="action-btn" href="https://tung010171.github.io/tunghaha/"
       target="_blank" rel="noopener" data-text="Nhấn vào đây"></a>
  </div>
  <div class="tab-panel">
    <a class="action-btn" href="https://tung010171.github.io/tunghaha/"
       target="_blank" rel="noopener" data-text="Nhấn vào đây"></a>
  </div>
</div>

<script>
(function(){
  /* ===== TÁCH CHỮ VÀO SPAN ===== */
  document.querySelectorAll('.action-btn').forEach(btn => {
    const text = btn.dataset.text || '';
    btn.innerHTML = '';
    [...text].forEach((c, i) => {
      const span = document.createElement('span');
      span.className = 'ch';
      span.textContent = c === ' ' ? '\u00A0' : c;    // giữ khoảng trắng
      span.style.animationDelay = (0.05 * i) + 's, 0s';
      btn.appendChild(span);
    });
  });

  /* ===== TAB NAV ===== */
  const list      = document.getElementById('tabList');
  const indicator = document.getElementById('indicator');
  const buttons   = Array.from(list.querySelectorAll('.tab-btn'));
  const panels    = Array.from(document.querySelectorAll('.tab-panel'));

  function moveIndicator(btn){
    const lr = list.getBoundingClientRect();
    const br = btn.getBoundingClientRect();
    indicator.style.width = br.width + 'px';
    indicator.style.transform = 'translateX(' + (br.left - lr.left + list.scrollLeft) + 'px)';
  }

  function centerTab(btn){
    const lr = list.getBoundingClientRect();
    const br = btn.getBoundingClientRect();
    const center = br.left - lr.left + list.scrollLeft + br.width/2;
    const target = center - list.clientWidth/2;
    const max = list.scrollWidth - list.clientWidth;
    list.scrollTo({ left: Math.max(0, Math.min(max, target)), behavior:'smooth' });
  }

  /* Chạy lại animation reveal mỗi khi panel hiện */
  function replayButton(panel){
    panel.querySelectorAll('.action-btn').forEach(btn => {
      btn.querySelectorAll('.ch').forEach(ch => {
        const oldDelay = ch.style.animationDelay;
        ch.style.animation = 'none';
        void ch.offsetWidth;                  // force reflow
        ch.style.animation = '';
        ch.style.animationDelay = oldDelay;   // khôi phục delay
      });
    });
  }

  function activate(btn){
    const i = buttons.indexOf(btn);
    buttons.forEach((b,j)=>{
      b.classList.toggle('is-active', i===j);
      b.tabIndex = i===j ? 0 : -1;
    });
    panels.forEach((p,j)=>p.classList.toggle('is-active', i===j));
    moveIndicator(btn);
    centerTab(btn);
    replayButton(panels[i]);     // chạy lại reveal cho panel mới
  }

  buttons.forEach(b => b.addEventListener('click', () => activate(b)));

  list.addEventListener('keydown', e => {
    const i = buttons.indexOf(document.activeElement);
    if (i < 0) return;
    let t = null;
    if (e.key === 'ArrowRight') t = buttons[(i+1) % buttons.length];
    if (e.key === 'ArrowLeft')  t = buttons[(i-1+buttons.length) % buttons.length];
    if (t){ e.preventDefault(); activate(t); t.focus(); }
  });

  window.addEventListener('resize', () => {
    const active = list.querySelector('.tab-btn.is-active');
    if (active) moveIndicator(active);
  });

  requestAnimationFrame(() => {
    const active = list.querySelector('.tab-btn.is-active');
    if (active) moveIndicator(active);
    replayButton(panels[0]);     // chạy reveal cho panel đầu khi load
  });
})();
</script>
</body>
</html>
